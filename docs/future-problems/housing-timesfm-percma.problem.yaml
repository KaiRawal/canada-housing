# DRAFT — reference only. Do not run. To promote: copy to
# .flywheel/problem.yaml on a fresh flywheel/<slug>-<ts> branch,
# re-measure constraints, resolve OPEN items, then /flywheel-new.
# Context: the one per-city TimesFM experiment never tried — joint LoRA tied
# (0.8217), per-CMA LoRA unknown. See docs/timesfm_multi_search.md (LoRA infra:
# grad-enabled decode replica, PEFT 0.21 post-merge state_dict() empty — capture
# pre-merge; joint val degraded with epochs).

problem: housing-timesfm-percma
type: prediction
goal: "Finetune one LoRA adapter per CMA on TimesFM 3.0 for signed month-to-month total-NHPI deltas — the per-city trained TimesFM never attempted — against frozen joint-3.0 and joint-LoRA controls. Must beat the pinned 0.8217 to matter."

target:
  scope: ["baselines/", "tests/", "artifacts/", "docs/", "prediction/", "evaluation/"]  # never touch data_cleaning/, imputation/ sources
  delivery: branch

datasets:
  - name: imputed-total
    source: prediction/y_train_full_total.csv  # y paired; deltas derived downstream per-CMA, never re-imputed; OPEN: confirm y CSVs ported to the run branch
    cache: none
  # CMA_SUBSET_16 (adapter fits; goals/gates/deliverables scope): Edmonton, Greater Sudbury, Hamilton, Kitchener-Cambridge-Waterloo, London, Montreal, Ottawa-Gatineau ON-part, Quebec, Regina, Saskatoon, St. Catharines-Niagara, St. John's, Vancouver, Victoria, Windsor, Winnipeg. Display-only: Halifax, Charlottetown, Guelph/Kelowna/Oshawa/Ottawa-Gatineau QC-part/Sherbrooke/Trois-Rivieres (frozen 2.5-uni fallback, never adapted).

blackbox:
  train: ".venv/bin/python baselines/train_timesfm_percma.py --target total"  # new module; all prior trainers untouched
  predict: ".venv/bin/python baselines/predict_timesfm_percma.py --target total"  # prints delta_rmse (16) + delta_rmse_24 + pass_rate + per-variant RMSEs
  metric: delta_rmse  # chained mask n=1728/2398; test scored exactly once

surrogate:
  family: delta-regression
  variants:
    - { name: joint3_frozen }  # control: frozen 3.0-multi recipe, must reproduce 0.8217 within tolerance
    - { name: lora_joint_r4 }  # control: joint LoRA rank-4 (prior tie 0.8217); separates adapter-machinery effects from per-city effects
    - { name: lora_percma_r4 }  # 16 per-CMA adapters, rank 4, query+value proj; selected per-CMA on rolling-origin inner windows
    - { name: lora_percma_r8 }  # 16 per-CMA adapters, rank 8; promote over r4 only on >=2/3-window agreement + >=1% margin

gates:
  correctness: "pass_rate == 1.0"  # all variant suites pass
  performance: "delta_rmse < 0.8217"  # must honestly beat frozen joint-3.0; test scored once — a fail means "no honest beat"
  budgets: { samples: 2500 }  # relaxed: reviewer scores ~full masks

hints: "Per-CMA fits are small (~420 rows) — overfitting is the default outcome; the joint-LoRA tie is the prior. Selection may use rolling-origin windows inside train freely; TEST SCORED EXACTLY ONCE, never selected on. 16-subset adaptation ONLY; 8 display frozen (never adapted). Infra carries over: grad-enabled decode replica bit-exact at init, PEFT pre-merge state_dict capture, rank-total ~2min/epoch CPU, kill line ~8min/epoch (budget guard). 3.0 weights NON-COMMERCIAL (research-compliant, note in docs); adapters are ours, ckpt via HF cache never committed. CPU torch (MLX 40x slower verdict carries over). Demand multi-window agreement; sub-1% inner deltas are noise. Report per-CMA: where adapters help (expect volatile pockets) vs hurt (expect quiet CMAs)."

deliverables:
  branch: "flywheel/housing-timesfm-percma-<ts>"
  artifacts: ["artifacts/joint3_frozen.joblib", "artifacts/lora_joint_r4.joblib", "artifacts/lora_percma_r4.joblib", "artifacts/lora_percma_r8.joblib", "artifacts/metrics.json", "artifacts/manifest.json"]
  tests: ["tests/test_percma_joint3_frozen.py", "tests/test_percma_lora_joint_r4.py", "tests/test_percma_lora_percma_r4.py", "tests/test_percma_lora_percma_r8.py"]
  docs: ["docs/percma_search.md"]  # per-CMA adapter verdicts + scope analysis + infra notes + license/fetch notes
  notebooks: []

constraints:
  venv: .venv  # needs timesfm3 + torch + peft (all present in prior venvs)
  disk_gb: 60  # OPEN: re-measure at promotion
  mem_gb: 16  # OPEN: re-measure at promotion
  timeout: "timeout 600"
  heavy_bg: false

models:
  orchestrator: "opencode/muse-spark-1.3-contributor-free"
  executor: "opencode/muse-spark-1.3-contributor-free"
