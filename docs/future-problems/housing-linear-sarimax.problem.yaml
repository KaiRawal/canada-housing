# DRAFT — reference only. Do not run. To promote: copy to
# .flywheel/problem.yaml on a fresh flywheel/<slug>-<ts> branch,
# re-measure constraints, resolve OPEN items, then /flywheel-new.

problem: housing-linear-sarimax
type: prediction
goal: "Build per-CMA sparse linear delta-forecasters with full SARIMAX-style features — lagged deltas, differences, seasonal lags, rolling statistics, moving-average (residual) terms, liberal cross-CMA predictors — tuned per CMA through iterative diagnose-and-refine rounds (never blind grids), for the signed month-to-month change in monthly total NHPI. Must beat the pinned pooled-AR(3) baseline to matter."

target:
  scope: ["baselines/", "tests/", "artifacts/", "docs/", "prediction/", "evaluation/"]  # prediction/ holds imputation-generated X/y CSVs + cma_centroids.csv; never touch data_cleaning/, imputation/ sources
  delivery: branch

datasets:
  - name: imputed-total
    source: prediction/X_train_full_total.csv  # generated: .venv/bin/python imputation/data_imputation.py; y paired as y_{train,test}_full_total.csv with cma_canonical+date; deltas derived downstream per-CMA (delta_t = y_t - y_{t-1}), never re-imputed
    cache: none
  # CMA_SUBSET_16 (goals/gates/deliverables scope): Edmonton, Greater Sudbury, Hamilton, Kitchener-Cambridge-Waterloo, London, Montreal, Ottawa-Gatineau ON-part, Quebec, Regina, Saskatoon, St. Catharines-Niagara, St. John's, Vancouver, Victoria, Windsor, Winnipeg. Display-only: Halifax, Charlottetown, Guelph/Kelowna/Oshawa/Ottawa-Gatineau QC-part/Sherbrooke/Trois-Rivieres.

blackbox:
  train: ".venv/bin/python baselines/train_sarimax.py --target total"  # new module; level/delta trainers untouched
  predict: ".venv/bin/python baselines/predict_sarimax.py --target total"  # prints delta_rmse (16-subset) + delta_rmse_24 (display) + pass_rate + per-round RMSEs
  metric: delta_rmse  # chained mask n=1728/2398 (see docs/delta_search.md frozen conventions); test scored exactly once

surrogate:
  family: delta-regression
  variants:
    # Rounds are SEQUENTIAL: each round diagnoses the previous round's pinned
    # errors before expanding. A round that cannot name which error pocket moved
    # (Ottawa-ON/KCW/Montreal/Windsor) and why is not done.
    - { name: sarimax_ar }  # per-CMA AR lags 1..12 + CMA-chosen lag order via chronological inner select; baseline to beat: pooled AR(3) 0.8499
    - { name: sarimax_ma }  # + rolling-residual (MA) terms, 2nd differences, seasonal-12 lags, rolling mean/std 3/6/12; promote only on inner-window beat over sarimax_ar
    - { name: sarimax_exo }  # + LIBERAL cross-CMA predictors (other CMAs' lagged deltas) + census exo, L1-pruned PER CMA; Sherbrooke-style poison check mandatory (exclude any predictor CMA that degrades inner windows)
    - { name: sarimax_pooled }  # partial-pooling reconciliation: shared sparse vector + shrunk per-CMA offsets (H1 learning); final form, refit on train+val-16

gates:
  correctness: "pass_rate == 1.0"  # all round suites pass
  performance: "delta_rmse < 0.8499"  # must honestly beat the pinned pooled-AR(3) linear_delta (docs/delta_search.md); test scored once — a fail means "no honest beat", not "bad model"
  budgets: { samples: 200 }

hints: "Signed deltas only, never levels. 16-subset fit/val/select ONLY; 8 display frozen, never fit on. Selection may use rolling-origin windows inside train freely; TEST IS SCORED EXACTLY ONCE, never selected on. Per-CMA hyperparams (alpha, lag order, exo set) chosen per CMA on chronological inner splits. MA terms = lags of rolling in-sample residuals, strictly causal. Sub-1% inner-window deltas are noise (learnings #5) — demand multi-window agreement before promoting a round. Dense estimators and capacity expansion stay dead (learnings). Each round's docs must table per-CMA RMSE vs previous round."

deliverables:
  branch: "flywheel/housing-linear-sarimax-<ts>"
  artifacts: ["artifacts/sarimax_ar.joblib", "artifacts/sarimax_ma.joblib", "artifacts/sarimax_exo.joblib", "artifacts/sarimax_pooled.joblib", "artifacts/metrics.json", "artifacts/manifest.json"]
  tests: ["tests/test_sarimax_ar.py", "tests/test_sarimax_ma.py", "tests/test_sarimax_exo.py", "tests/test_sarimax_pooled.py"]
  docs: ["docs/sarimax_search.md"]  # per-round diagnosis: what was tried, which pocket moved, why promoted/killed
  notebooks: []

constraints:
  venv: .venv
  disk_gb: 60  # OPEN: re-measure at promotion
  mem_gb: 16  # OPEN: re-measure at promotion
  timeout: "timeout 600"
  heavy_bg: false

models:
  orchestrator: "opencode/muse-spark-1.3-contributor-free"
  executor: "opencode/muse-spark-1.3-contributor-free"
